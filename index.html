<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для моей любимой жены &hearts;</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }
        .container {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            animation: fadeIn 0.5s ease-in-out;
            z-index: 10;
        }
        .container.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .photo-frame {
            width: 100%;
            height: 300px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-frame img.offset-photo {
            object-position: center 30%;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        p {
            color: #666;
            margin-bottom: 20px;
            font-size: 1rem;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 15px;
            text-align: center;
        }
        input:focus {
            border-color: #ff6b6b;
        }
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover {
            background: #ff5252;
            transform: scale(1.02);
        }
        .btn-option {
            background: #f0f2f5;
            color: #333;
            border: 2px solid #ddd;
        }
        .btn-option:hover {
            background: #ff6b6b;
            color: white;
            border-color: #ff6b6b;
        }
        .collage-container {
            max-width: 800px;
            width: 95%;
        }
        .collage-img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        /* Красивые элементы салюта и конфетти */
        .firework-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            animation: burst 1s forwards ease-out;
            z-index: 100;
        }
        @keyframes burst {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0.3);
                opacity: 0;
            }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 15px;
            pointer-events: none;
            animation: fall 2s forwards linear;
            z-index: 100;
        }
        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(80vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Фоновая музыка -->
    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mp3">
    </audio>

    <!-- СТРАНИЦА 0: Приветствие и музыка -->
    <div id="page0" class="container active">
        <div style="font-size: 50px; color: #ff6b6b; margin-bottom: 15px;">&hearts;</div>
        <h2>Привет, моя родная!</h2>
        <p>Для тебя приготовлен небольшой сюрприз. Нажми на кнопку, чтобы включить музыку и начать.</p>
        <button onclick="startMusicAndNext()">Включить музыку и войти &hearts;</button>
    </div>

    <!-- СТРАНИЦА 1: Авторизация (пароль) -->
    <div id="page1" class="container">
        <div class="photo-frame">
            <img src="images/photo1.jpeg" alt="Наше фото">
        </div>
        <h2>Введите пароль, чтобы войти &hearts;</h2>
        <input type="password" id="passwordInput" placeholder="Подсказка: наша дата...">
        <button onclick="checkPassword()">Войти</button>
        <p id="errorMsg" style="color: #ff6b6b; margin-top: 10px; font-size: 0.9rem;"></p>
    </div>

    <!-- СТРАНИЦА 2: Вопрос с убегающими кнопками -->
    <div id="page2" class="container">
        <div class="photo-frame">
            <img src="images/photo2.jpeg" alt="Наше фото">
        </div>
        <h2>Любишь ли ты меня? 🥰</h2>
        <button class="btn-option" onclick="nextPage('page3')">Да, безумно! &hearts;</button>
        <button id="weekendBtn" class="btn-option" style="position: relative;" onmouseover="moveButton('weekendBtn', 'weekendScale')" onclick="moveButton('weekendBtn', 'weekendScale')">По выходным немножко 😄</button>
        <button id="runawayBtn" class="btn-option" style="position: relative;" onmouseover="moveButton('runawayBtn', 'runawayScale')" onclick="moveButton('runawayBtn', 'runawayScale')">Конечно нет 😈</button>
    </div>

    <!-- СТРАНИЦА 3: Вопрос про колледж -->
    <div id="page3" class="container">
        <div class="photo-frame">
            <img src="images/photo3.jpeg" alt="Наше фото" class="offset-photo">
        </div>
        <h2>А была ли ты влюблена в меня в колледже? 😉</h2>
        <button class="btn-option" onclick="nextPage('page4')">Дааа ❤️</button>
        <button class="btn-option" onclick="handleCollegeNo()">Нет</button>
    </div>

    <!-- СТРАНИЦА 4: Финал (Коллаж + Мощный салют) -->
    <div id="page4" class="container collage-container">
        <h2>Наша прекрасная история вместе &hearts;</h2>
        <div style="margin-bottom: 20px;">
            <img src="images/collage.jpeg" alt="Свадебный коллаж" class="collage-img">
        </div>
        <p style="font-size: 1.1rem; color: #ff6b6b; font-weight: bold;">Люблю тебя бесконечно! Спасибо, что ты у меня есть! 💍🥂</p>
        
        <div class="action-row">
            <button onclick="launchMegaFireworks()" style="background: #ffb142; font-size: 1.1rem; padding: 15px;">Запустить грандиозный салют ✨🎆</button>
        </div>
    </div>

    <script>
        function startMusicAndNext() {
            var music = document.getElementById("bgMusic");
            if (music) {
                music.play().catch(function(error) {
                    console.log("Автозапуск заблокирован браузером");
                });
            }
            switchPage('page0', 'page1');
        }

        function switchPage(currentId, nextId) {
            document.getElementById(currentId).classList.remove('active');
            document.getElementById(nextId).classList.add('active');
        }

        function nextPage(nextId) {
            const activePage = document.querySelector('.container.active');
            activePage.classList.remove('active');
            document.getElementById(nextId).classList.add('active');
        }

        function checkPassword() {
            const pass = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');
            const correctPassword = '10102018'; 

            if (pass === correctPassword) {
                nextPage('page2');
            } else {
                errorMsg.textContent = 'Неверный пароль, родная! Попробуй еще раз &hearts;';
            }
        }

        let collegeNoClicks = 0;

        function playErrorSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch(e) {}
        }

        function handleCollegeNo() {
            collegeNoClicks++;
            playErrorSound();

            if (collegeNoClicks === 1) {
                alert("Ошибка Windows: Нужно отвечать честно! ⚠️");
            } else if (collegeNoClicks === 2) {
                alert("Ошибка Windows: Подумай хорошо, может забыла?! 🤔");
            } else {
                nextPage('page4');
            }
        }

        let weekendScale = 1;
        let runawayScale = 1;

        function moveButton(btnId, scaleVarName) {
            const btn = document.getElementById(btnId);
            
            if (scaleVarName === 'weekendScale') {
                weekendScale = Math.max(0.4, weekendScale - 0.1);
                btn.style.transform = `scale(${weekendScale})`;
            } else {
                runawayScale = Math.max(0.4, runawayScale - 0.1);
                btn.style.transform = `scale(${runawayScale})`;
            }
            
            const x = (Math.random() - 0.5) * 250;
            const y = (Math.random() - 0.5) * 200;
            btn.style.transform += ` translate(${x}px, ${y}px)`;
        }

        // Синтезатор звука взрыва салюта (бабах)
        function playExplosionSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Низкий бас взрыва
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.5);
                
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch(e) {}
        }

        // Функция грандиозного мега-салюта и конфетти
        function launchMegaFireworks() {
            // Запускаем серию из 5 мощных залпов с интервалом
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    playExplosionSound();
                    createFireworkBurst(
                        Math.random() * (window.innerWidth - 200) + 100,
                        Math.random() * (window.innerHeight - 300) + 100
                    );
                }, i * 400);
            }
            // Добавляем падающее конфетти
            createConfettiRain();
        }

        function createFireworkBurst(x, y) {
            const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#ff6b81', '#ffffff'];
            const particleCount = 40; // Количество искр в одной вспышке

            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.classList.add('firework-particle');
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                
                const color = colors[Math.floor(Math.random() * colors.length)];
                p.style.backgroundColor = color;
                p.style.boxShadow = `0 0 10px ${color}`;

                // Уголки разлета искр во все стороны
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 120 + 40;
                const tx = Math.cos(angle) * speed;
                const ty = Math.sin(angle) * speed;

                p.style.setProperty('--tx', `${tx}px`);
                p.style.setProperty('--ty', `${ty}px`);

                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
        }

        function createConfettiRain() {
            const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#ff6b81'];
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const c = document.createElement('div');
                    c.classList.add('confetti');
                    c.style.left = Math.random() * window.innerWidth + 'px';
                    c.style.top = '-20px';
                    c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0%';
                    
                    document.body.appendChild(c);
                    setTimeout(() => c.remove(), 2000);
                }, i * 30);
            }
        }
    </script>
</body>
</html>
