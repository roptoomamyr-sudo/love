<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для моей любимой жены &hearts;</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }
        .container {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            animation: fadeIn 0.5s ease-in-out;
            z-index: 10;
        }
        .container.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .photo-frame {
            width: 100%;
            height: 300px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Опускаем фото на третьем слайде ниже, чтобы было видно лицо */
        .photo-frame img.offset-photo {
            object-position: center 30%;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        p {
            color: #666;
            margin-bottom: 20px;
            font-size: 1rem;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 15px;
            text-align: center;
        }
        input:focus {
            border-color: #ff6b6b;
        }
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover {
            background: #ff5252;
            transform: scale(1.02);
        }
        .btn-option {
            background: #f0f2f5;
            color: #333;
            border: 2px solid #ddd;
        }
        .btn-option:hover {
            background: #ff6b6b;
            color: white;
            border-color: #ff6b6b;
        }
        .collage-container {
            max-width: 800px;
            width: 95%;
        }
        .collage-img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        /* Стили для салюта */
        .firework {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            box-shadow: 0 0 #fff;
            animation: explode 1s infinite linear;
            z-index: 5;
        }
        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(30); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Фоновая музыка -->
    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mp3">
    </audio>

    <!-- СТРАНИЦА 0: Приветствие и музыка -->
    <div id="page0" class="container active">
        <div style="font-size: 50px; color: #ff6b6b; margin-bottom: 15px;">&hearts;</div>
        <h2>Привет, моя родная!</h2>
        <p>Для тебя приготовлен небольшой сюрприз. Нажми на кнопку, чтобы включить музыку и начать.</p>
        <button onclick="startMusicAndNext()">Включить музыку и войти &hearts;</button>
    </div>

    <!-- СТРАНИЦА 1: Авторизация (пароль) -->
    <div id="page1" class="container">
        <div class="photo-frame">
            <img src="images/photo1.jpeg" alt="Наше фото">
        </div>
        <h2>Введите пароль, чтобы войти &hearts;</h2>
        <input type="password" id="passwordInput" placeholder="Подсказка: наша дата...">
        <button onclick="checkPassword()">Войти</button>
        <p id="errorMsg" style="color: #ff6b6b; margin-top: 10px; font-size: 0.9rem;"></p>
    </div>

    <!-- СТРАНИЦА 2: Вопрос "Любишь ли ты меня?" с убегающими кнопками -->
    <div id="page2" class="container">
        <div class="photo-frame">
            <img src="images/photo2.jpeg" alt="Наше фото">
        </div>
        <h2>Любишь ли ты меня? 🥰</h2>
        <button class="btn-option" onclick="nextPage('page3')">Да, безумно! &hearts;</button>
        
        <!-- Убегающие кнопки -->
        <button id="weekendBtn" class="btn-option" style="position: relative;" onmouseover="moveButton('weekendBtn', 'weekendScale')" onclick="moveButton('weekendBtn', 'weekendScale')">По выходным немножко 😄</button>
        <button id="runawayBtn" class="btn-option" style="position: relative;" onmouseover="moveButton('runawayBtn', 'runawayScale')" onclick="moveButton('runawayBtn', 'runawayScale')">Конечно нет 😈</button>
    </div>

    <!-- СТРАНИЦА 3: Вопрос "Была ли влюблена в колледже" -->
    <div id="page3" class="container">
        <div class="photo-frame">
            <img src="images/photo3.jpeg" alt="Наше фото" class="offset-photo">
        </div>
        <h2>А была ли ты влюблена в меня в колледже? 😉</h2>
        <button class="btn-option" onclick="nextPage('page4')">Дааа ❤️</button>
        <button class="btn-option" onclick="handleCollegeNo()">Нет</button>
    </div>

    <!-- СТРАНИЦА 4: Финал (Коллаж + Салют) -->
    <div id="page4" class="container collage-container">
        <h2>Наша прекрасная история вместе &hearts;</h2>
        <div style="margin-bottom: 20px;">
            <img src="images/collage.jpeg" alt="Свадебный коллаж" class="collage-img">
        </div>
        <p style="font-size: 1.1rem; color: #ff6b6b; font-weight: bold;">Люблю тебя бесконечно! Спасибо, что вы у меня есть! 💍🥂</p>
        
        <div class="action-row">
            <button onclick="triggerFireworks()" style="background: #ffb142;">Запустить салют ✨</button>
        </div>
    </div>

    <script>
        function startMusicAndNext() {
            var music = document.getElementById("bgMusic");
            if (music) {
                music.play().catch(function(error) {
                    console.log("Автозапуск заблокирован браузером");
                });
            }
            switchPage('page0', 'page1');
        }

        function switchPage(currentId, nextId) {
            document.getElementById(currentId).classList.remove('active');
            document.getElementById(nextId).classList.add('active');
        }

        function nextPage(nextId) {
            const activePage = document.querySelector('.container.active');
            activePage.classList.remove('active');
            document.getElementById(nextId).classList.add('active');
        }

        function checkPassword() {
            const pass = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');
            const correctPassword = '10102018'; 

            if (pass === correctPassword) {
                nextPage('page2');
            } else {
                errorMsg.textContent = 'Неверный пароль, родная! Попробуй еще раз &hearts;';
            }
        }

        // Счетчик кликов "Нет" для колледжа
        let collegeNoClicks = 0;

        function playErrorSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch(e) {}
        }

        function handleCollegeNo() {
            collegeNoClicks++;
            playErrorSound();

            if (collegeNoClicks === 1) {
                alert("Ошибка Windows: Нужно отвечать честно! ⚠️");
            } else if (collegeNoClicks === 2) {
                alert("Ошибка Windows: Подумай хорошо, может забыла?! 🤔");
            } else {
                nextPage('page4');
            }
        }

        // Логика убегания и уменьшения для обеих кнопок
        let weekendScale = 1;
        let runawayScale = 1;

        function moveButton(btnId, scaleVarName) {
            const btn = document.getElementById(btnId);
            
            if (scaleVarName === 'weekendScale') {
                weekendScale = Math.max(0.4, weekendScale - 0.1);
                btn.style.transform = `scale(${weekendScale})`;
            } else {
                runawayScale = Math.max(0.4, runawayScale - 0.1);
                btn.style.transform = `scale(${runawayScale})`;
            }
            
            const x = (Math.random() - 0.5) * 250;
            const y = (Math.random() - 0.5) * 200;
            btn.style.transform += ` translate(${x}px, ${y}px)`;
        }

        // Функция салюта на последнем слайде
        function triggerFireworks() {
            for (let i = 0; i < 7; i++) {
                setTimeout(() => {
                    const fw = document.createElement('div');
                    fw.classList.add('firework');
                    fw.style.left = Math.random() * window.innerWidth + 'px';
                    fw.style.top = Math.random() * window.innerHeight + 'px';
                    
                    const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);
                    fw.style.backgroundColor = randomColor;
                    fw.style.boxShadow = `0 0 20px 10px ${randomColor}`;
                    
                    document.body.appendChild(fw);
                    setTimeout(() => fw.remove(), 1000);
                }, i * 200);
            }
        }
    </script>
</body>
</html>
